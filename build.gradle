plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'com.replaymod.preprocess' version "${preprocessor_version}"
}

def devBuildEnv = providers.environmentVariable('DEV_BUILD').getOrNull()
def isDevBuild = devBuildEnv != null && devBuildEnv.toBoolean()

if (devBuildEnv == null) {
	def gitBranch = ''

	try {
		gitBranch = providers.exec {
			commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
			ignoreExitValue = true
		}.standardOutput.asText.get().trim()
	} catch (Exception ignored) {
		// Fall back to release naming when the branch cannot be detected.
	}

	isDevBuild = gitBranch == 'dev'
}

subprojects { subproject ->
	subproject.version = rootProject.mod_version
	subproject.group = rootProject.maven_group

	subproject.plugins.withId('java') {
		subproject.base {
			archivesName = rootProject.archives_base_name
		}

		subproject.tasks.withType(AbstractArchiveTask).configureEach {
			def minecraftSeries = subproject.name.replaceFirst(/-fabric$/, '')
			archiveVersion = "${subproject.version}-mc${minecraftSeries}${isDevBuild ? '-dev' : ''}"
		}
	}
}

preprocess {
	strictExtraMappings.set(false)

	def mc1218Fabric = createNode('1.21.8-fabric', 1_21_08, '')
	def mc12110Fabric = createNode('1.21.10-fabric', 1_21_10, '')
	def mc12111Fabric = createNode('1.21.11-fabric', 1_21_11, '')
	def mc2601Fabric = createNode('26.1-fabric', 26_01_02, '')
	def mc2602Fabric = createNode('26.2-fabric', 26_02_00, '')
	def mc2603Fabric = createNode('26.3-fabric', 26_03_00, '')

	mc1218Fabric.link(mc12110Fabric, file('versions/mapping-fabric-1.21.8-1.21.10.txt'))
	mc12110Fabric.link(mc12111Fabric, file('versions/mapping-fabric-1.21.10-1.21.11.txt'))
	mc12111Fabric.link(mc2601Fabric, file('versions/mapping-fabric-1.21.11-26.1.txt'))
	mc2601Fabric.link(mc2602Fabric, file('versions/mapping-fabric-26.1-26.2.txt'))
	mc2602Fabric.link(mc2603Fabric, file('versions/mapping-fabric-26.2-26.3.txt'))
}
